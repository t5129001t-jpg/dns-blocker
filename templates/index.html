<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Local DNS Blocker Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            background-color: #f8f9fa;
            padding-top: 20px;
        }

        .card {
            margin-bottom: 20px;
            border-radius: 15px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .stat-number {
            font-size: 2.5rem;
            font-weight: bold;
        }

        .text-blocked {
            color: #dc3545;
        }

        .text-allowed {
            color: #198754;
        }

        .chart-container {
            position: relative;
            height: 300px;
        }
    </style>
</head>

<body>

    <div class="container">
        <h1 class="text-center mb-4">🛡️ Local DNS Blocker</h1>

        <!-- Статистика -->
        <div class="row">
            <div class="col-md-4">
                <div class="card p-4 text-center">
                    <h3>📊 Всего запросов</h3>
                    <div class="stat-number" id="total-req">0</div>
                    <small class="text-muted">за 24 часа</small>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card p-4 text-center">
                    <h3>🚫 Заблокировано</h3>
                    <div class="stat-number text-blocked" id="total-blocked">0</div>
                    <small class="text-muted">трекеров</small>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card p-4 text-center">
                    <h3>✅ Разрешено</h3>
                    <div class="stat-number text-allowed" id="total-allowed">0</div>
                    <small class="text-muted">доменов</small>
                </div>
            </div>
        </div>

        <!-- График -->
        <div class="row">
            <div class="col-md-12">
                <div class="card p-4">
                    <h3>📈 Активность за последние 24 часа</h3>
                    <div class="chart-container">
                        <canvas id="activityChart"></canvas>
                    </div>
                </div>
            </div>
        </div>

        <!-- Топ заблокированных -->
        <div class="row">
            <div class="col-md-6">
                <div class="card p-4">
                    <h3>🔥 Топ заблокированных</h3>
                    <ul class="list-group list-group-flush mt-3" id="top-blocked">
                        <li class="list-group-item">Загрузка...</li>
                    </ul>
                </div>
            </div>
            <div class="col-md-6">
                <div class="card p-4">
                    <h3>➕ Добавить в чёрный список</h3>
                    <form id="add-domain-form" class="mt-3">
                        <div class="input-group">
                            <input type="text" class="form-control" id="new-domain" placeholder="example.com" required>
                            <button class="btn btn-danger" type="submit">Заблокировать</button>
                        </div>
                    </form>
                    <div id="add-result" class="mt-2"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let activityChart;

        async function updateStats() {
            try {
                const response = await fetch('/api/stats');
                const data = await response.json();

                document.getElementById('total-req').innerText = data.total_requests;
                document.getElementById('total-blocked').innerText = data.total_blocked;
                document.getElementById('total-allowed').innerText = data.total_requests - data.total_blocked;

                // Обновляем топ
                const topList = document.getElementById('top-blocked');
                topList.innerHTML = '';
                if (data.top_blocked.length === 0) {
                    topList.innerHTML = '<li class="list-group-item">Нет данных</li>';
                } else {
                    data.top_blocked.forEach(item => {
                        topList.innerHTML += `
                        <li class="list-group-item d-flex justify-content-between align-items-center">
                            ${item[0]}
                            <span class="badge bg-danger rounded-pill">${item[1]}</span>
                        </li>`;
                    });
                }

                // Обновляем график
                updateChart(data.hourly_stats);

            } catch (error) {
                console.error("Ошибка:", error);
            }
        }

        function updateChart(hourlyData) {
            const ctx = document.getElementById('activityChart').getContext('2d');

            if (activityChart) {
                activityChart.destroy();
            }

            activityChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: hourlyData.map(h => h.hour),
                    datasets: [{
                        label: 'Запросов в час',
                        data: hourlyData.map(h => h.count),
                        borderColor: '#007bff',
                        backgroundColor: 'rgba(0, 123, 255, 0.1)',
                        tension: 0.4,
                        fill: true
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { display: false }
                    },
                    scales: {
                        y: { beginAtZero: true }
                    }
                }
            });
        }

        // Обработка формы добавления домена
        document.getElementById('add-domain-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const domain = document.getElementById('new-domain').value.trim();
            const resultDiv = document.getElementById('add-result');

            try {
                const response = await fetch('/api/add-block', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ domain: domain })
                });

                const data = await response.json();

                if (data.success) {
                    resultDiv.innerHTML = `<div class="alert alert-success">✅ Домен ${domain} добавлен в чёрный список!</div>`;
                    document.getElementById('new-domain').value = '';
                    setTimeout(() => updateStats(), 500); // Обновляем статистику
                } else {
                    resultDiv.innerHTML = `<div class="alert alert-danger">❌ Ошибка: ${data.message}</div>`;
                }
            } catch (error) {
                resultDiv.innerHTML = `<div class="alert alert-danger">❌ Ошибка сети</div>`;
            }
        });

        // Обновляем каждые 5 секунд
        setInterval(updateStats, 5000);
        updateStats();
    </script>

</body>

</html>
